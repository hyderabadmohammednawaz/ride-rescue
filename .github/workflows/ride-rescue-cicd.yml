name: RideRescue CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-web-tests:
    name: Selenium Web Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Selenium Tests
        run: python Testing_Reports/web_selenium_tests.py
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium_Web_Tests
          path: Testing_Reports/web_selenium_report.xlsx
          if-no-files-found: ignore

  appium-mobile-tests:
    name: Appium Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Appium Tests
        run: python Testing_Reports/mobile_appium_tests.py
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium_Mobile_Tests
          path: Testing_Reports/mobile_appium_report.xlsx
          if-no-files-found: ignore

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Load Tests
        run: python Testing_Reports/web_load_tests.py
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Load_Tests
          path: Testing_Reports/web_load_report.xlsx
          if-no-files-found: ignore

  dast-security-tests:
    name: DAST Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run DAST Tests
        run: python Testing_Reports/Vulnerability_Testing_Tests.py
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAST_Security_Tests
          path: Testing_Reports/web_security_report.xlsx
          if-no-files-found: ignore

  bundle-reports:
    name: Bundle Reports
    needs: [selenium-web-tests, appium-mobile-tests, load-tests, dast-security-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: Testing_Reports
      - name: Upload Bundled Reports
        uses: actions/upload-artifact@v4
        with:
          name: Testing_Reports
          path: Testing_Reports/

  deploy-web:
    name: Deploy Web
    needs: bundle-reports
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: web
